# Render/Railway/Cloud Run provide PORT; locally it falls back to 8080
server.port=${PORT:8080}

app.firebase.project-id=crowdingfunding

# Provide ONE of these (never commit the key file):
#  - FIREBASE_SERVICE_ACCOUNT_JSON : full JSON content of the service-account key (best for hosting)
#  - FIREBASE_SERVICE_ACCOUNT_PATH : path to the key file (best for local development)
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Comma separated list of frontend origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ayushhsengar.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://localhost:3000}

spring.jackson.default-property-inclusion=non_null
